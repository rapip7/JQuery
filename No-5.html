<!DOCTYPE html>
<html>
<head>
    <title>Jquery Dasar</title>
    <script type="text/javascript" src="jquery.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
   <h1>PPLG JQuery Dasar</h1>
     <button id="tombol">TOMBOL</button>
    <div class="box"></div>
</body>
    <script type="text/javascript">
        $(document).ready(function(){
            $("#tombol").click(function(){
                $(".box").fadeOut();
            });
        });
    </script>
</html>
<body>{
    font-family: sans-serif;
}
h1{
    text-align:center;
}
.box{
    height: 300px;
    width:300px;
    background:orange;
}
tombol{
    padding:10px;
    color:#fff;
    background:#34495E;
    border:none;
}
</body>
